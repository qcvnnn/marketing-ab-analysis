services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PGDATABASE:-marketing_ab_portfolio}
      POSTGRES_USER: ${PGUSER:-marketing_ab_app}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${PGPORT:-55433}:5432"
    volumes:
      - campaign_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  campaign_pg:
